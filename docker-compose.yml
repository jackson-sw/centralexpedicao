services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burntech-expedicao-app
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 3002
      EXPEDICAO_PASSWORD_HASH: ${EXPEDICAO_PASSWORD_HASH}
      EM_CAMPO_PASSWORD_HASH: ${EM_CAMPO_PASSWORD_HASH}
      ALMOXARIFADO_PASSWORD_HASH: ${ALMOXARIFADO_PASSWORD_HASH}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      MAIL_SERVER: ${MAIL_SERVER:-smtp-mail.outlook.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
      ROMANEIO_EMAIL_TO: ${ROMANEIO_EMAIL_TO:-jackson.weber@burntech.com.br}
      ERP_DB_HOST: ${ERP_DB_HOST}
      ERP_DB_PORT: ${ERP_DB_PORT:-1433}
      ERP_DB_NAME: ${ERP_DB_NAME}
      ERP_DB_USER: ${ERP_DB_USER}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD}
      ERP_DB_ENCRYPT: ${ERP_DB_ENCRYPT:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: burntech-expedicao-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Executa o DDL automaticamente apenas na primeira inicialização do volume
      - ./banco_de_dados.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
